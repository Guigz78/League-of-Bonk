# App iOS : compile le jeu (Capacitor) sur un Mac de GitHub.
# - Toujours : une app non signée (LeagueOfBonk-non-signee.ipa) à télécharger dans les « Artifacts » du run,
#   installable sur son iPhone avec Sideloadly / AltStore et un identifiant Apple gratuit.
# - Si les secrets App Store Connect sont configurés : envoi automatique sur TestFlight (compte développeur Apple).
#   Secrets : APPLE_TEAM_ID, APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 (contenu du fichier .p8, rôle Admin).
name: App iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['js/**', 'css/**', 'index.html', 'fonts/**', 'icons/**', 'vendor/**', 'ios/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/ios.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HAS_ASC: ${{ secrets.APPSTORE_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances
        run: npm ci
      - name: Jeu dans le projet iOS
        run: npm run ios:sync

      - name: App non signée
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive | tail -n 40
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          # contrôle : le jeu est bien embarqué et l'app est en portrait plein écran
          APP="$RUNNER_TEMP/ipa/Payload/App.app"
          for f in public/index.html public/js/main.js public/js/native.js public/vendor/three.module.min.js capacitor.config.json; do
            test -s "$APP/$f" || { echo "::error::manquant dans l'app : $f"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIStatusBarHidden' "$APP/Info.plist" | grep -q true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          echo "fichiers du jeu dans l'app : $(find "$APP/public" -type f | wc -l)"
          (cd "$RUNNER_TEMP/ipa" && zip -qry ../LeagueOfBonk-non-signee.ipa Payload)
          ls -lh "$RUNNER_TEMP/LeagueOfBonk-non-signee.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: LeagueOfBonk-non-signee-${{ github.run_number }}
          path: ${{ runner.temp }}/LeagueOfBonk-non-signee.ipa
          retention-days: 30

      - name: Envoi sur TestFlight
        if: env.HAS_ASC == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"; printf '%s' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Signed.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${AUTH[@]}" archive | tail -n 40
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Signed.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
